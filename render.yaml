services:
  - type: web
    name: maguro
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: BOX_PRICE
        value: "1350"
      - key: TIMEZONE
        value: Asia/Bangkok
      - key: DATA_DIR
        value: data
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_REDIRECT_URI
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_IG_USER_ID
        sync: false
